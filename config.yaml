# One entry per question bank PDF.
banks:
  p2:
    label: "Paper 2: Multiple choice"
    kind: mcq
    pdf: input/question_bank.pdf
    data_dir: data            # inside site/
    image_dir: images         # inside site/
    ocr: false                # this PDF has a real text layer
    questions_per_request: 8
    answers_start_page: 665
    # Page numbers are this bank's contents page; the sections match the syllabus.
    chapters: *syllabus_chapters
    sections: *syllabus_sections

  p6:
    label: "Paper 6: Alternative to practical"
    kind: structured
    pdf: input/p6_question_bank.pdf
    data_dir: data/p6
    image_dir: images/p6
    ocr: true                 # headings and references are images of text, read with OCR
    footer_logo_pt: 700       # ignore the publisher's logo below this line
