# ---------------------------------------------------------------
# 0625 Question Bank - configuration
# ---------------------------------------------------------------

render_dpi: 200            # resolution of extracted question images
header_zone_pt: 55         # running headers sit above this line (points from top)

dedupe:                    # Paper 2 only
  hash_distance: 10
  # "Visually identical" = at most this many differing ink pixels in total,
  # and no more than max_diff_per_patch in any character-sized patch.
  # Kept strict on purpose: copies that were re-scanned slightly differently
  # are caught later by comparing Gemini's transcriptions instead.
  max_diff_pixels: 40
  max_diff_per_patch: 15

gemini:
  # Check https://ai.google.dev/gemini-api/docs/models for current free-tier models.
  model: gemini-3.8-flash
  max_requests_per_run: 10  # the Action runs hourly; it stops early if the quota runs out
  seconds_between_requests: 15
  max_attempts: 3           # give up on a question after this many failed tagging attempts

# The current syllabus that learning-objective tags refer to (2023-2025).
syllabus:
  pdf: input/syllabus.pdf
  chapters: &syllabus_chapters
    - {num: 1, title: "Motion, forces and energy"}
    - {num: 2, title: "Thermal physics"}
    - {num: 3, title: "Waves"}
    - {num: 4, title: "Electricity and magnetism"}
    - {num: 5, title: "Nuclear physics"}
    - {num: 6, title: "Space physics"}
  sections: &syllabus_sections
    - {code: "1.1", title: "Physical quantities and measurement techniques", start_page: 7}
    - {code: "1.2", title: "Motion", start_page: 23}
    - {code: "1.3", title: "Mass and weight", start_page: 59}
    - {code: "1.4", title: "Density", start_page: 75}
    - {code: "1.5", title: "Forces", start_page: 90}
    - {code: "1.6", title: "Momentum", start_page: 142}
    - {code: "1.7", title: "Energy, work and power", start_page: 156}
    - {code: "1.8", title: "Pressure", start_page: 198}
    - {code: "2.1", title: "Kinetic particle model of matter", start_page: 223}
    - {code: "2.2", title: "Thermal properties and temperature", start_page: 242}
    - {code: "2.3", title: "Transfer of thermal energy", start_page: 281}
    - {code: "3.1", title: "General properties of waves", start_page: 307}
    - {code: "3.2", title: "Light", start_page: 332}
    - {code: "3.3", title: "Electromagnetic spectrum", start_page: 382}
    - {code: "3.4", title: "Sound", start_page: 392}
    - {code: "4.1", title: "Simple phenomena of magnetism", start_page: 409}
