# ---------------------------------------------------------------
# IGCSE question bank - configuration
# ---------------------------------------------------------------
# Subjects > banks. Each bank is one compiled PDF (e.g. Biology Paper 6).
# A bank's id is "<subject>-<bank>", e.g. physics-p2 or biology-p6.
#
# For a new bank's PDF, attach it to the GitHub release under the name given
# by release_asset, then run "1. Extract questions" and choose the bank.

render_dpi: 200            # resolution of extracted question images
header_zone_pt: 55         # running headers sit above this line (points from top)

dedupe:                    # multiple-choice banks only
  hash_distance: 10
  # "Visually identical" = at most this many differing ink pixels in total,
  # and no more than max_diff_per_patch in any character-sized patch.
  max_diff_pixels: 40
  max_diff_per_patch: 15

gemini:
  # Check https://ai.google.dev/gemini-api/docs/models for current free-tier models.
  model: gemini-3.8-flash
  max_requests_per_run: 10  # the Action runs hourly; it stops early if the quota runs out
  seconds_between_requests: 15
  max_attempts: 3           # give up on a question after this many failed tagging attempts

# Practical skills Gemini can tag Paper 6 questions with, and their labels on the site.
skills:
  readings: "Readings"
  tables: "Tables"
  graphs: "Graphs"
  calculations: "Calculations"
  conclusions: "Conclusions"
  planning: "Planning"
  precautions: "Precautions and accuracy"
  drawings: "Drawings"
  tests: "Tests and identification"

