name: 2. Tag questions with Gemini

# Runs every hour. Each run tags a few batches, stops early if the free
# quota is used up, and commits whatever it managed. Once everything is
# tagged the runs finish in seconds; you can then disable this workflow.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tag a few batches
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/tag.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --staged --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Tag questions ($(date -u '+%Y-%m-%d %H:%M'))"
          git pull --rebase
          git push
