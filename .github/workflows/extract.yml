name: 1. Extract questions

# Run this by hand (Actions tab > "1. Extract questions" > Run workflow) and
# choose which question bank to extract. Each bank's PDF is attached to the
# GitHub release under the file name set by release_asset in config.yaml:
#   physics-p2   question_bank.pdf       physics-p6   p6_question_bank.pdf
#   biology-p2   biology_p2.pdf          biology-p6   biology_p6.pdf
#   chemistry-p2 chemistry_p2.pdf        chemistry-p6 chemistry_p6.pdf
# Re-running it rebuilds that bank's images and question list; tags are kept.
on:
  workflow_dispatch:
    inputs:
      bank:
        description: "Question bank to extract"
        type: choice
        options: [physics-p2, physics-p6, biology-p2, biology-p6, chemistry-p2, chemistry-p6]
        default: biology-p2

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR (for PDFs whose headings are images of text)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch the PDF from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$(python scripts/common.py asset ${{ inputs.bank }})"
          echo "Downloading $name"
          gh release download --pattern "$name" --dir input --clobber
          ls -lh input
      - name: Split the PDF into questions
        run: python scripts/extract.py --bank ${{ inputs.bank }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/images site/data
          if git diff --staged --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Extract ${{ inputs.bank }} questions from PDF"
          git pull --rebase
          git push
