name: 1. Extract questions

# Run this by hand (Actions tab > "1. Extract questions" > Run workflow)
# after adding input/question_bank.pdf. Re-running it rebuilds the images
# and question list; Gemini tags are kept.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Split the PDF into questions
        run: python scripts/extract.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/images site/data
          if git diff --staged --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Extract questions from PDF"
          git push
