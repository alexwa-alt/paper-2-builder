name: 1. Extract questions

# Run this by hand (Actions tab > "1. Extract questions" > Run workflow) and
# choose which question bank to extract. The PDFs are too large to commit
# through the website, so they are attached to a release instead and
# downloaded here (overwriting any file already in input/):
#   Paper 2 -> question_bank.pdf
#   Paper 6 -> p6_question_bank.pdf
# Re-running it rebuilds that bank's images and question list; tags are kept.
on:
  workflow_dispatch:
    inputs:
      bank:
        description: "Question bank to extract"
        type: choice
        options: [p2, p6]
        default: p2

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the question bank PDF from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.bank }}" = "p6" ]; then name="p6_question_bank.pdf"; else name="question_bank.pdf"; fi
          gh release download --pattern "$name" --dir input --clobber
          ls -lh input
      - name: Install OCR (Paper 6 headings are images of text)
        if: inputs.bank == 'p6'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Split the PDF into questions
        run: python scripts/extract.py --bank ${{ inputs.bank }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/images site/data
          if git diff --staged --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Extract ${{ inputs.bank }} questions from PDF"
          git pull --rebase
          git push
