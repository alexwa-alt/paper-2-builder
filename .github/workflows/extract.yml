name: 1. Extract questions

# Run this by hand (Actions tab > "1. Extract questions" > Run workflow).
# The question bank PDF is too large to commit through the website, so it is
# attached to a release instead and downloaded here (overwriting any file
# already in input/).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the question bank PDF from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --pattern "question_bank.pdf" --dir input --clobber
          ls -lh input
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Split the PDF into questions
        run: python scripts/extract.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/images site/data
          if git diff --staged --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Extract questions from PDF"
          git push
